<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Visitas — Recrutamento Studio WEN</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    :root { color-scheme: dark; --bg: #0f0b17; --text: #f6f2ff; --muted: #c4b9dc; --accent: #f0c419; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
    .num { font-size: clamp(4rem, 20vw, 9rem); font-weight: 700; color: var(--accent); line-height: 1; margin: 8px 0 12px; font-variant-numeric: tabular-nums; }
    p { margin: 0 0 6px; color: var(--muted); }
    h1 { font-size: 1.1rem; font-weight: 600; margin: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Página de candidatura — freelancer de audiovisual</h1>
    <div class="num" id="total" aria-live="polite">…</div>
    <p>pessoas acessaram (contando 1 vez por navegador)</p>
    <p id="quando"></p>
  </main>
  <script>
    fetch("https://abacus.jasoncameron.dev/get/wenprodutora-recrutamento/visitas", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        document.getElementById("total").textContent = (d.value || 0).toLocaleString("pt-BR");
        document.getElementById("quando").textContent = "Atualizado em " + new Date().toLocaleString("pt-BR");
      })
      .catch(function () {
        document.getElementById("total").textContent = "—";
        document.getElementById("quando").textContent = "Não foi possível carregar o contador agora. Tente recarregar.";
      });
  </script>
</body>
</html>
